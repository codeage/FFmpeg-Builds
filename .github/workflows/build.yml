name: Build FFmpeg

# Narrowed fork workflow: builds a single configuration (win64, GPL, shared libraries,
# FFmpeg pinned to the tag selected by the addin below) and publishes it as a release.
# Upstream builds every target/variant on a daily schedule; this fork only builds on push
# or manual dispatch, so no scheduled traffic is generated.

on:
  push:
    branches:
      - 'builds/**'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      doRelease:
        description: 'Publish a release'
        type: boolean
        default: true
        required: false
      linkMap:
        description: 'Also produce linker maps of the shared libraries (no release)'
        type: boolean
        default: false
        required: false

env:
  DOCKER_BUILDKIT: 1
  TARGET: win64
  VARIANT: gpl-shared 9.0.2 slim
  FFVERSION: 9.0.2

jobs:
  build_base:
    name: Build base image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image Name
        id: imagename
        run: |
          IMG="${GITHUB_REPOSITORY,,}/base"
          IMG="${IMG// /-}"
          echo "name=ghcr.io/${IMG}" >> $GITHUB_OUTPUT
      - name: Stop Commands
        run: T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
      - name: Build base image
        uses: docker/build-push-action@v7
        with:
          context: images/base
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.imagename.outputs.name }}:latest
          cache-to: type=registry,mode=max,ref=${{ steps.imagename.outputs.name }}:cache
          cache-from: type=registry,ref=${{ steps.imagename.outputs.name }}:cache
      - name: Get download cache key
        id: dl_cache
        run: |
          echo "dltagname=$(./util/get_dl_cache_tag.sh)" >> $GITHUB_OUTPUT
      - name: Cache
        uses: actions/cache@v6
        with:
          path: .cache/downloads
          key: download-cache-${{ steps.dl_cache.outputs.dltagname }}
          restore-keys: |
            download-cache-
      - name: Update Cache
        run: |
          set -e
          ./download.sh
          ./util/clean_cache.sh

  build_target_base:
    name: Build target base image
    needs: build_base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image Name
        id: imagename
        run: |
          IMG="${GITHUB_REPOSITORY,,}/base-${TARGET}"
          IMG="${IMG// /-}"
          echo "name=ghcr.io/${IMG}" >> $GITHUB_OUTPUT
          echo "gh_repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      - name: Stop Commands
        run: T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
      - name: Build target base image
        uses: docker/build-push-action@v7
        with:
          context: images/base-${{ env.TARGET }}
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.imagename.outputs.name }}:latest
          cache-to: type=registry,mode=max,ref=${{ steps.imagename.outputs.name }}:cache
          cache-from: type=registry,ref=${{ steps.imagename.outputs.name }}:cache
          build-args: |
            GH_REPO=ghcr.io/${{ steps.imagename.outputs.gh_repo }}
            BASE_TAG_SUFFIX=

  build_target:
    name: Build target-variant image
    needs: build_target_base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image Name
        id: imagename
        run: |
          IMG="${GITHUB_REPOSITORY,,}/${TARGET}-${VARIANT}"
          IMG="${IMG// /-}"
          echo "name=ghcr.io/${IMG}" >> $GITHUB_OUTPUT
      - name: Get download cache key
        id: dl_cache
        run: |
          echo "dltagname=$(./util/get_dl_cache_tag.sh)" >> $GITHUB_OUTPUT
      - name: Stop Commands
        run: T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
      - name: Generate Dockerfile
        run: ./generate.sh ${TARGET} ${VARIANT}
      - name: Cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/downloads
          key: download-cache-${{ steps.dl_cache.outputs.dltagname }}
          fail-on-cache-miss: true
      - name: Build target-variant image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.imagename.outputs.name }}:latest
          cache-to: type=registry,mode=max,ref=${{ steps.imagename.outputs.name }}:cache
          cache-from: |
            type=registry,ref=${{ steps.imagename.outputs.name }}:cache
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/ffmpeg-builds/win64-gpl-shared-9.0.2:cache

  build_ffmpeg:
    name: Build ffmpeg
    needs: build_target
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build ffmpeg
        env:
          FFBUILD_LINKMAP: ${{ github.event.inputs.linkMap == 'true' && '1' || '' }}
        run: |
          T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
          ./build.sh ${TARGET} ${VARIANT}
      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.zip > checksums.sha256
          cat checksums.sha256
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-build
          overwrite: true
          path: artifacts/*

  publish_release:
    name: Publish release
    if: ${{ !cancelled() && needs.build_ffmpeg.result == 'success' && github.event.inputs.linkMap != 'true' && (github.event_name == 'push' || github.event.inputs.doRelease == 'true') }}
    needs: build_ffmpeg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-build
          path: artifacts
      - name: Create release
        run: |
          set -xe
          VER="${FFVERSION}"
          TAGNAME="${VER}-${TARGET}-gpl-shared-slim-build${GITHUB_RUN_NUMBER}"
          {
            echo "FFmpeg ${VER} (tag n${VER}), ${TARGET}, GPL, shared libraries, slim (see addins/slim.sh and addins/slim.drop)."
            echo
            echo "Built by run ${GITHUB_RUN_ID} from commit ${GITHUB_SHA}."
            echo
            echo '```'
            cat artifacts/checksums.sha256
            echo '```'
          } > release_body.md
          gh release create "$TAGNAME" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAGNAME" --notes-file release_body.md artifacts/*.zip artifacts/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ github.token }}
